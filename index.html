<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระบบบันทึกการเบิกน้ำยาและวัสดุห้องปฏิบัติการ | โรงพยาบาลโนนสะอาด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --forest-dark: #28502E;
      --moss-green: #47682C;
      --leaf-bright: #D2E59E;
      --sprout-soft: #DCEDB9;
      --mist-slate: #B1C1C0;
      --sage-tint: #EBF2E2;
      --cream-card: rgba(255, 255, 252, 0.94);
      --text-main: #1C2B1E;
      --text-muted: #556657;
      --border-line: #CFDCCA;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 20px 14px 56px;
      font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background: linear-gradient(
        180deg,
        var(--mist-slate) 0%,
        #DCE8DF 36%,
        var(--sprout-soft) 72%,
        var(--leaf-bright) 100%
      );
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ฉากหลังท้องฟ้า ก้อนเมฆ ต้นไม้ และเนินเขา */
    .scenic-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .scenic-bg svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 490px;
      margin: 0 auto;
    }

    .card {
      background: var(--cream-card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(40, 80, 46, 0.16);
      border-radius: 20px;
      padding: 22px 20px 26px;
      box-shadow: 0 14px 34px rgba(40, 80, 46, 0.12);
    }

    .org-badge {
      display: inline-block;
      background: var(--sage-tint);
      border: 1px solid rgba(71, 104, 44, 0.25);
      color: var(--forest-dark);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-line);
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.24rem;
      font-weight: 700;
      color: var(--forest-dark);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .title-group p {
      margin: 4px 0 0;
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .header-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #FFFFFF;
      border: 1px solid var(--border-line);
      color: var(--forest-dark);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-pill.active {
      background: var(--leaf-bright);
      border-color: var(--moss-green);
      color: var(--forest-dark);
      font-weight: 600;
    }

    .btn-scan {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 16px;
      background: var(--forest-dark);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-scan:hover {
      background: #1E3E23;
    }

    .btn-scan:active {
      transform: scale(0.99);
    }

    #reader {
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-line);
      display: none;
    }

    .paste-box {
      margin-top: 14px;
      padding: 12px;
      background: #F5F9EE;
      border: 1px dashed #B5C99A;
      border-radius: 12px;
    }

    .paste-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .paste-row {
      display: flex;
      gap: 8px;
    }

    .paste-row input {
      flex: 1;
      min-width: 0;
    }

    .btn-parse {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--moss-green);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 0 13px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-parse:hover {
      background: var(--forest-dark);
    }

    .form-section {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--forest-dark);
    }

    .req {
      color: #B44332;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="password"],
    select {
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.94rem;
      color: var(--text-main);
      background: #FFFFFF;
      border: 1px solid var(--border-line);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--moss-green);
      box-shadow: 0 0 0 3px rgba(71, 104, 44, 0.15);
    }

    input[readonly],
    select:disabled {
      background: #EFF4EA;
      color: var(--text-muted);
    }

    .btn-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      width: 100%;
      padding: 14px 16px;
      background: var(--moss-green);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--forest-dark);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      display: block;
      background: #E4F0DC;
      color: var(--forest-dark);
      border: 1px solid #B6D0A7;
    }

    .status-msg.error {
      display: block;
      background: #FBECE9;
      color: #8E2E20;
      border: 1px solid #E8C0B9;
    }

    /* หน้าต่างกรอกรหัสผ่านเข้าใช้งาน */
    .pin-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(40, 80, 46, 0.42);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .pin-overlay.show {
      display: flex;
    }

    .pin-box {
      width: 100%;
      max-width: 360px;
      background: #FFFFFF;
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: 22px 20px;
      box-shadow: 0 16px 36px rgba(40, 80, 46, 0.2);
    }

    .pin-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .padlock-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--sage-tint);
      border: 1px solid rgba(71, 104, 44, 0.25);
      color: var(--forest-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pin-box h2 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--forest-dark);
    }

    .pin-box p {
      margin: 0 0 14px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .pin-error {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #9E2A1C;
      min-height: 18px;
    }

    .btn-pin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 8px;
      width: 100%;
      padding: 11px 14px;
      background: var(--forest-dark);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-pin:hover {
      background: #1E3E23;
    }

    .ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .ico-sm {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- หน้าต่างยืนยันรหัสผ่านก่อนเข้าใช้งาน -->
  <div id="pinOverlay" class="pin-overlay" aria-modal="true" role="dialog">
    <form class="pin-box" onsubmit="verifyPin(event)">
      <div class="pin-header">
        <span class="padlock-badge" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <h2>ยืนยันรหัสผ่านเข้าใช้งาน</h2>
      </div>
      <p>ระบบบันทึกการเบิกน้ำยาและวัสดุห้องปฏิบัติการ โรงพยาบาลโนนสะอาด</p>
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required />
      <div id="pinError" class="pin-error"></div>
      <button type="submit" class="btn-pin">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <span>ปลดล็อกหน้าจอ</span>
      </button>
    </form>
  </div>

  <!-- ฉากหลังท้องฟ้า ก้อนเมฆ ต้นไม้ และเนินเขา (#B1C1C0, #DCEDB9, #D2E59E, #47682C, #28502E) -->
  <div class="scenic-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#B1C1C0" />
          <stop offset="48%" stop-color="#DCE8DF" />
          <stop offset="100%" stop-color="#DCEDB9" />
        </linearGradient>
      </defs>

      <rect width="1440" height="900" fill="url(#skyGrad)" />

      <!-- ก้อนเมฆนุ่มๆ บนท้องฟ้า -->
      <g fill="#FFFFFF" opacity="0.72">
        <path d="M130,150 Q165,105 220,128 Q265,92 320,126 Q365,124 382,162 L105,162 Q108,145 130,150 Z" />
        <path d="M640,105 Q675,72 720,90 Q755,68 795,95 Q830,96 842,122 L620,122 Q622,106 640,105 Z" />
        <path d="M1060,165 Q1100,118 1160,140 Q1210,105 1265,138 Q1310,138 1328,175 L1035,175 Q1038,158 1060,165 Z" />
      </g>

      <!-- เนินเขาไกล -->
      <path fill="#D2E59E" d="M0,560 Q320,470 690,545 T1440,505 L1440,900 L0,900 Z" />

      <!-- เนินเขากลาง -->
      <path fill="#47682C" opacity="0.88" d="M0,635 Q390,555 820,625 T1440,590 L1440,900 L0,900 Z" />

      <!-- ต้นไม้ด้านซ้าย -->
      <g>
        <rect x="92" y="610" width="12" height="55" rx="4" fill="#3B2E22" />
        <circle cx="98" cy="592" r="32" fill="#47682C" />
        <circle cx="76" cy="605" r="24" fill="#28502E" />
        <circle cx="120" cy="605" r="25" fill="#28502E" />

        <rect x="165" y="625" width="10" height="45" rx="3" fill="#3B2E22" />
        <circle cx="170" cy="610" r="24" fill="#47682C" />
        <circle cx="154" cy="618" r="18" fill="#28502E" />
      </g>

      <!-- ต้นไม้ด้านขวา -->
      <g>
        <rect x="1310" y="595" width="13" height="60" rx="4" fill="#3B2E22" />
        <circle cx="1316" cy="575" r="35" fill="#47682C" />
        <circle cx="1292" cy="590" r="26" fill="#28502E" />
        <circle cx="1340" cy="590" r="27" fill="#28502E" />

        <rect x="1235" y="620" width="10" height="45" rx="3" fill="#3B2E22" />
        <circle cx="1240" cy="605" r="23" fill="#47682C" />
        <circle cx="1256" cy="614" r="17" fill="#28502E" />
      </g>

      <!-- เนินเขาหน้า -->
      <path fill="#28502E" d="M0,710 Q360,660 760,715 T1440,685 L1440,900 L0,900 Z" />

      <!-- พุ่มไม้เตี้ย -->
      <g>
        <circle cx="55" cy="735" r="22" fill="#47682C" />
        <circle cx="80" cy="742" r="18" fill="#DCEDB9" opacity="0.55" />
        <circle cx="1385" cy="722" r="24" fill="#47682C" />
        <circle cx="1360" cy="730" r="18" fill="#DCEDB9" opacity="0.55" />
      </g>
    </svg>
  </div>

  <div class="container">
    <div class="card">
      <div class="org-badge">กลุ่มงานเทคนิคการแพทย์ โรงพยาบาลโนนสะอาด จังหวัดอุดรธานี</div>

      <div class="header">
        <div class="title-group">
          <h1>ระบบบันทึกการเบิกน้ำยาและวัสดุห้องปฏิบัติการ</h1>
          <p>สแกนคิวอาร์โค้ดหรือกรอกรายการเพื่อบันทึกลงคลังวัสดุ</p>
        </div>
        <div class="header-actions">
          <button type="button" id="lockBtn" class="btn-pill" onclick="toggleLock()">ล็อกค่าเริ่มต้น</button>
          <button type="button" class="btn-pill" onclick="lockScreen()">
            <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>ล็อกหน้าจอ</span>
          </button>
        </div>
      </div>

      <button type="button" id="scanBtn" class="btn-scan" onclick="toggleScanner()">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span id="scanBtnText">เปิดกล้องสแกน QR Code</span>
      </button>
      <div id="reader"></div>

      <div class="paste-box">
        <span class="paste-label">วางข้อความจาก QR เพื่อแยกข้อมูลอัตโนมัติ</span>
        <div class="paste-row">
          <input type="text" id="rawQrInput" placeholder="ชื่อรายการ#Lot#Exp" />
          <button type="button" class="btn-parse" onclick="parseManualQr()">
            <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
            </svg>
            <span>แยกข้อมูล</span>
          </button>
        </div>
      </div>

      <form id="reqForm" class="form-section" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="itemName">ชื่อน้ำยา / วัสดุ <span class="req">*</span></label>
          <input type="text" id="itemName" placeholder="สแกน QR หรือระบุชื่อรายการ" required />
        </div>

        <div class="row-2">
          <div class="form-group">
            <label for="lotNo">Lot No. <span class="req">*</span></label>
            <input type="text" id="lotNo" placeholder="ระบุเลข Lot" required />
          </div>
          <div class="form-group">
            <label for="expDate">วันหมดอายุ <span class="req">*</span></label>
            <input type="text" id="expDate" placeholder="YYYY-MM-DD" required />
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label for="department">จุดเบิก / หน่วยงาน <span class="req">*</span></label>
            <select id="department" required>
              <option value="LAB">LAB</option>
              <option value="ผู้ป่วยใน">ผู้ป่วยใน</option>
              <option value="ห้องฉุกเฉิน">ห้องฉุกเฉิน</option>
              <option value="OPD/ARI/TB">OPD/ARI/TB</option>
              <option value="ห้องคลอด">ห้องคลอด</option>
              <option value="จิตเวช">จิตเวช</option>
              <option value="รพ.สต.">รพ.สต.</option>
              <option value="PCU">PCU</option>
              <option value="ผู้ป่วยนอก">ผู้ป่วยนอก</option>
              <option value="NCD">NCD</option>
            </select>
          </div>
          <div class="form-group">
            <label for="quantity">จำนวนที่เบิก <span class="req">*</span></label>
            <input type="number" id="quantity" value="1" min="1" step="any" required />
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label for="requester">ชื่อผู้เบิก <span class="req">*</span></label>
            <select id="requester" required>
              <option value="" disabled selected>-- เลือกชื่อผู้เบิก --</option>
              <option value="มาริณี">มาริณี</option>
              <option value="ศิริพร">ศิริพร</option>
              <option value="วิทิตานนท์">วิทิตานนท์</option>
              <option value="พรรณทิภา">พรรณทิภา</option>
              <option value="เด่นนภา">เด่นนภา</option>
              <option value="จักรพล">จักรพล</option>
              <option value="ปิยวรรณ">ปิยวรรณ</option>
            </select>
          </div>
          <div class="form-group">
            <label for="withdrawDate">วันที่เบิก <span class="req">*</span></label>
            <input type="date" id="withdrawDate" required />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span id="submitBtnText">บันทึกเข้าแท็บ "เบิก"</span>
        </button>
        <div id="statusMsg" class="status-msg"></div>
      </form>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgnw39ebr7og4Y4yAraP7kWPXatsNL874-H3nTkr0ho_WcrHfoOp1T5dQgG10Wdvrx/exec";
    const ACCESS_PIN = "11017"; // เปลี่ยนรหัสผ่านเข้าใช้งานได้ที่นี่
    const AUTH_SESSION_KEY = "beik_screen_unlocked";

    let html5QrCode = null;
    let isScanning = false;
    let isLocked = false;

    window.addEventListener("DOMContentLoaded", () => {
      setTodayDate();
      loadSavedPrefs();
      checkScreenAuth();
    });

    function checkScreenAuth() {
      const unlocked = sessionStorage.getItem(AUTH_SESSION_KEY) === "1";
      const overlay = document.getElementById("pinOverlay");
      if (!unlocked) {
        overlay.classList.add("show");
        setTimeout(() => document.getElementById("pinInput").focus(), 50);
      } else {
        overlay.classList.remove("show");
      }
    }

    function verifyPin(e) {
      e.preventDefault();
      const input = document.getElementById("pinInput");
      const errorEl = document.getElementById("pinError");
      if (input.value.trim() === ACCESS_PIN) {
        sessionStorage.setItem(AUTH_SESSION_KEY, "1");
        input.value = "";
        errorEl.textContent = "";
        document.getElementById("pinOverlay").classList.remove("show");
      } else {
        errorEl.textContent = "รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง";
        input.select();
      }
    }

    function lockScreen() {
      if (isScanning && html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById("reader").style.display = "none";
          document.getElementById("scanBtnText").textContent = "เปิดกล้องสแกน QR Code";
          isScanning = false;
        }).catch(() => {});
      }
      sessionStorage.removeItem(AUTH_SESSION_KEY);
      document.getElementById("pinError").textContent = "";
      document.getElementById("pinInput").value = "";
      document.getElementById("pinOverlay").classList.add("show");
      setTimeout(() => document.getElementById("pinInput").focus(), 50);
    }

    function setTodayDate() {
      const today = new Date();
      const offset = today.getTimezoneOffset();
      const localDate = new Date(today.getTime() - offset * 60000);
      document.getElementById("withdrawDate").value = localDate.toISOString().split("T")[0];
    }

    function loadSavedPrefs() {
      const savedDept = localStorage.getItem("beik_dept");
      const savedUser = localStorage.getItem("beik_user");
      if (savedDept) document.getElementById("department").value = savedDept;
      if (savedUser) document.getElementById("requester").value = savedUser;
    }

    function toggleLock() {
      isLocked = !isLocked;
      const btn = document.getElementById("lockBtn");
      const dept = document.getElementById("department");
      const req = document.getElementById("requester");
      const dateInput = document.getElementById("withdrawDate");

      dept.disabled = isLocked;
      req.disabled = isLocked;
      dateInput.readOnly = isLocked;

      if (isLocked) {
        btn.textContent = "ปลดล็อกค่า";
        btn.classList.add("active");
        localStorage.setItem("beik_dept", dept.value);
        if (req.value) localStorage.setItem("beik_user", req.value);
      } else {
        btn.textContent = "ล็อกค่าเริ่มต้น";
        btn.classList.remove("active");
      }
    }

    function toggleScanner() {
      const readerDiv = document.getElementById("reader");
      const scanBtnText = document.getElementById("scanBtnText");

      if (isScanning && html5QrCode) {
        html5QrCode.stop().then(() => {
          readerDiv.style.display = "none";
          scanBtnText.textContent = "เปิดกล้องสแกน QR Code";
          isScanning = false;
        }).catch(() => {});
        return;
      }

      readerDiv.style.display = "block";
      scanBtnText.textContent = "ปิดกล้องสแกน";
      html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        (decodedText) => {
          document.getElementById("rawQrInput").value = decodedText;
          fillFromQrText(decodedText);
          html5QrCode.stop().then(() => {
            readerDiv.style.display = "none";
            scanBtnText.textContent = "เปิดกล้องสแกน QR Code";
            isScanning = false;
          });
        },
        () => {}
      ).catch(() => {
        showStatus("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้องหรือวางข้อความ QR แทน", "error");
        readerDiv.style.display = "none";
        scanBtnText.textContent = "เปิดกล้องสแกน QR Code";
        isScanning = false;
      });

      isScanning = true;
    }

    function parseManualQr() {
      const raw = document.getElementById("rawQrInput").value.trim();
      if (!raw) return;
      fillFromQrText(raw);
    }

    function fillFromQrText(text) {
      const parts = text.split("#").map(s => s.trim());
      if (parts[0]) document.getElementById("itemName").value = parts[0];
      if (parts[1]) document.getElementById("lotNo").value = parts[1];
      if (parts[2]) document.getElementById("expDate").value = parts[2];
    }

    function showStatus(msg, type) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg;
      el.className = "status-msg " + type;
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const deptVal = document.getElementById("department").value;
      const reqVal = document.getElementById("requester").value;

      if (!reqVal) {
        showStatus("กรุณาเลือกชื่อผู้เบิกก่อนบันทึกข้อมูล", "error");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      const submitBtnText = document.getElementById("submitBtnText");
      submitBtn.disabled = true;
      submitBtnText.textContent = "กำลังบันทึกข้อมูล...";

      localStorage.setItem("beik_dept", deptVal);
      localStorage.setItem("beik_user", reqVal);

      const payload = {
        rawQr: document.getElementById("rawQrInput").value.trim(),
        itemName: document.getElementById("itemName").value.trim(),
        lotNo: document.getElementById("lotNo").value.trim(),
        expDate: document.getElementById("expDate").value.trim(),
        department: deptVal,
        quantity: Number(document.getElementById("quantity").value) || 1,
        requester: reqVal,
        withdrawDate: document.getElementById("withdrawDate").value
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        showStatus("บันทึกข้อมูลเรียบร้อยแล้ว", "success");
        document.getElementById("rawQrInput").value = "";
        document.getElementById("itemName").value = "";
        document.getElementById("lotNo").value = "";
        document.getElementById("expDate").value = "";
        document.getElementById("quantity").value = "1";
      } catch (err) {
        showStatus("เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtnText.textContent = 'บันทึกเข้าแท็บ "เบิก"';
      }
    }
  </script>
</body>
</html>
